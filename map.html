<style>
@font-face{font-family:'Anton';src:url('/fonts/anton.woff2') format('woff2');font-weight:400;font-display:swap}

:root{--signal:#FF6B1A;--chalk:#EEF2F8;--mute:#8C99AF;--hair:rgba(255,255,255,.10);

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04060b}
body{font-family:var(--hud);color:var(--chalk);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;
  padding:14px clamp(16px,4vw,30px);
  background:linear-gradient(180deg,rgba(3,6,12,.94),rgba(3,6,12,0))}
.bar a,.bar button{background:rgba(0,0,0,.5);border:1px solid var(--hair);color:var(--chalk);
  font-family:var(--hud);font-size:9px;letter-spacing:.18em;padding:8px 12px;cursor:pointer;
  text-decoration:none}
.bar a:hover,.bar button:hover{border-color:rgba(255,107,26,.55);color:var(--signal)}
.bar .t{font-size:9.5px;letter-spacing:.2em;color:var(--signal)}
.bar .sp{flex:1}
.cities{position:fixed;left:clamp(12px,3vw,24px);bottom:22px;z-index:10;
  display:flex;flex-wrap:wrap;gap:6px;max-width:min(420px,86vw)}
.cities button{background:rgba(0,0,0,.55);border:1px solid var(--hair);color:#B6C4D8;
  font-family:var(--hud);font-size:8px;letter-spacing:.14em;padding:6px 9px;cursor:pointer}
.cities button.on{border-color:rgba(255,107,26,.6);color:var(--signal)}
.info{position:fixed;right:clamp(12px,3vw,24px);bottom:22px;z-index:10;display:none;
  width:min(290px,80vw);background:rgba(6,10,18,.95);border:1px solid rgba(255,107,26,.35);
  padding:14px 16px;font-size:9px;letter-spacing:.08em;line-height:1.9;color:#B6C4D8}
.info.on{display:block}
.info b{display:block;font-family:var(--disp);font-size:15px;letter-spacing:.04em;
  color:var(--chalk);margin-bottom:8px}
.info i{font-style:normal;color:#6E7C93}
.info em{font-style:normal;color:var(--signal)}
.info .k{margin-top:10px;padding-top:9px;border-top:1px solid var(--hair);color:#FF8A3C}
.legend{position:fixed;left:clamp(12px,3vw,24px);bottom:72px;z-index:10;
  font-size:7px;letter-spacing:.14em;color:#6E7C93;line-height:1.9}
@media(max-width:640px){.legend{display:none}.cities{bottom:14px}.info{bottom:64px}}
</style></head><body>

function size(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;

let lon=8.68, lat=50.11, sc=9000, scT=9000, sel=null, dirty=true;
const STYLE={rail:['rgba(108,128,160,.28)',1,[5,5]],river:['rgba(52,104,178,.55)',2.6,null],
 primary:['rgba(96,124,172,.42)',1.2,null],trunk:['rgba(128,158,208,.52)',1.8,null],

const BB={};
for(const k in ROADS) BB[k]=ROADS[k].map(l=>{let a=9e9,b=9e9,c=-9e9,d=-9e9;
  for(const p of l){if(p[0]<a)a=p[0];if(p[0]>c)c=p[0];if(p[1]<b)b=p[1];if(p[1]>d)d=p[1];}
  return [a,b,c,d];});
const P=()=>{const kx=Math.cos(lat*Math.PI/180);

function draw(t){
  requestAnimationFrame(draw);
  const mv=Math.abs(scT-sc)>0.5;
  if(!mv&&!dirty&&!sel) return;
  sc+=(scT-sc)*0.16; dirty=false;
  const p=P();
  const l0=lon-(W/2)/(sc*p.kx), l1=lon+(W/2)/(sc*p.kx);
  const t0=lat-(H/2)/sc, t1=lat+(H/2)/sc;

  ctx.globalCompositeOperation='source-over';

  ctx.lineJoin='round'; ctx.lineCap='round';
  for(const k of ['rail','river','primary','trunk','motorway']){
    const st=STYLE[k];

    const arr=ROADS[k], bb=BB[k];

  ctx.globalCompositeOperation='lighter';

function show(d){

    '<div class="k">KING OF THE COURT<br><i>Unclaimed — up for grabs in Season 01</i></div>';
